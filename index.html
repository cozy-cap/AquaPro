<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Плавання, Спорт, Здоров'я">
    <meta name="author" content="Олег Шеремет">
    <meta name="description" content="Онлайн магазин приладдя для плавання.">
    <title>Aqua Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Got from google fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tilt+Warp');

<body>
    <header>
        <div class="header-logo">
            <a href="index.html" id="logo-link">
                <h1>Aqua Pro</h1>
            </a>
        </div>
        <div class="catalog">
            
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eeeeee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="catalog-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M14 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /></svg>
                <p class="catalog-text">Каталог</p>
            </div>
        </div>
        <div class="search">
            <input type="text" id="search-input" maxlength="200" placeholder="Я шукаю..."><button id="submit" type="button"></button>
        </div>
        <div class="cart">
            <button id="cart-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cart-button-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 17h-11v-14h-2" /><path d="M6 5l14 1l-1 7h-13" /></svg>
            </button>
        </div>
        <div class="profile-button">
            <button id="profile-image"></button>
        </div>
    </header>
    <main>
        <div class="banner">
            <img src="image/portrait-athlete-competing-olympic-games-tournament.png" alt="Основний банер" width="100%" id="banner-image">
        </div>
        <div class="go-up">
            <a href="#top-logo" id="go-up"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="go-up-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M17 3.34a10 10 0 1 1 -14.995 8.984l-.005 -.324l.005 -.324a10 10 0 0 1 14.995 -8.336zm-4.98 3.66l-.163 .01l-.086 .016l-.142 .045l-.113 .054l-.07 .043l-.095 .071l-.058 .054l-4 4l-.083 .094a1 1 0 0 0 1.497 1.32l2.293 -2.293v5.586l.007 .117a1 1 0 0 0 1.993 -.117v-5.585l2.293 2.292l.094 .083a1 1 0 0 0 1.32 -1.497l-4 -4l-.082 -.073l-.089 -.064l-.113 -.062l-.081 -.034l-.113 -.034l-.112 -.02l-.098 -.006z" /></svg></a>
        </div>
    </main>
    <footer>
        <div class="footer-top">
            <div class="footer-logo">
                <a href="index.html" id="about-foot-logo">Aqua Pro</a>
            </div>
            <div class="links">
                <nav id="about-foot-nav">
                    <a href="about.html" id="about-text">Про нас</a>
                    <a href="contacts.html" id="contacts-text">Контакти</a>
                    <a href="social.html" id="contacts-text">Соціальні мережі</a>
                    <a href="delivery.html" id="contacts-text">Доставка</a>
                </nav>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="copyright">
                <p id="copyright-text">Олег Шеремет &copy; 2026</p>
            </div>
        </div>
    </footer>
</body>
</html>
