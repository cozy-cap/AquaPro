<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta name="robots" content="index, follow">
    <title>Aqua Pro - Головна</title>
    <link rel="icon" type="image/x-icon" href="image/drop.ico">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/script.js"></script>

<body id="top">
    <header class="header">
        <div class="header__logo">
            <a href="index.html" class="header__logo-link">
                <h1 class="header__logo-text" style="color:#59a3d4">Aqua Pro</h1>
            </a>
        </div>
        <nav class="header__catalog">

            </div>
            <ul class="header__catalog-dropdown">
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Окуляри</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Ласти</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Шапочки</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">М'ячі</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Круги</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Купальники та плавки</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Спорт і захоплення</li></button>
                <button class="header__catalog-button" onclick="location.href='searchResults.html';"><li class="header__catalog-dropdown-item">Інвентар для дітей з особливостями</li></button>
            </ul>
        </nav>
        <div class="header__search">
            <input type="text" class="header__search-input" maxlength="200" placeholder="Я шукаю...">
            <button class="header__search-submit" type="button" onclick="location.href='searchResults.html';"></button>
        </div>
        <div class="header__cart">
            <button class="header__cart-button" onclick="location.href='cart.html';">
                <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header__cart-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M15 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 17h-11v-14h-2" /><path d="M6 5l14 1l-1 7h-13" /></svg>

        </div>
        <div class="header__profile">
            <button class="header__profile-button" onclick="location.href='profile.html';"></button>
        </div>

    <main class="main-layout">
        <aside class="sidebar">
            <h3 class="sidebar__title">Профіль</h3>
            <ul class="sidebar__profile__list">

                <li class="sidebar__profile__list-item">
                    <a href="">історія замовлення</a>

        <div class="profile-history">

                    <div class="profile-history__item-info__group">
                        <span class="profile-history__item-info__group-number">N 3761946</span>
                        <span class="profile-history__item-info__group-date">19.02.2026</span>
                    </div>
                    <span class="profile-history__item-info-done">Виконано</span>
                </div>
            </div>
            <div class="profile-history__item">
                <img src="https://content.rozetka.com.ua/goods/images/big/600475603.jpg" alt="Рюкзак TYR" class="profile-history__item-image">
                <div class="profile-history__item-info">
                    <div class="profile-history__item-info__group">
                        <span class="profile-history__item-info__group-number">N 4316478</span>
                        <span class="profile-history__item-info__group-date">26.03.2026</span>
                    </div>
                    <span class="profile-history__item-info-inProgress">В процесі</span>
                </div>
            </div>
        </div>

    <button class="go-up-btn" onclick="topFunction()"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" class="go-up-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10.586 3l-6.586 6.586a2 2 0 0 0 -.434 2.18l.068 .145a2 2 0 0 0 1.78 1.089h2.586v7a2 2 0 0 0 2 2h4l.15 -.005a2 2 0 0 0 1.85 -1.995l-.001 -7h2.587a2 2 0 0 0 1.414 -3.414l-6.586 -6.586a2 2 0 0 0 -2.828 0z" /></svg></button>
    <footer class="footer">
        <div class="footer__grid">
            <div class="footer__col">
                <h4 class="footer__title">Інформація</h4>
                <a href="about.html" class="footer__link">Про нас</a>
                <a href="delivery.html" class="footer__link">Умови доставки</a>
            </div>
            <div class="footer__col">
                <h4 class="footer__title">Допомога</h4>
                <a href="contacts.html" class="footer__link">Контакти</a>

            <div class="footer__col">

                <a href="https://www.instagram.com/" class="footer__link" target="_blank">Instagram</a>
                <a href="https://www.facebook.com/" class="footer__link" target="_blank">Facebook</a>

            <p>Олег Шеремет &copy; 2026. Всі права захищені.</p>
